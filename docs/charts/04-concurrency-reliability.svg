<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="Concurrency limits and reliability"><rect width="1100" height="620" fill="#FBFCFE"/><rect width="1100" height="9" fill="#223B55"/><text x="58" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#193049">Concurrency limits and reliability</text><text x="58" y="112" font-family="Arial, sans-serif" font-size="19" fill="#576779">50 requests | simulated downstream capacity: 10 | one process</text><rect x="310" y="154" width="22" height="16" rx="4" fill="#1B9A73"/><text x="342" y="168" font-family="Arial, sans-serif" font-size="18" fill="#30495F">Successful (HTTP 200)</text><rect x="620" y="154" width="22" height="16" rx="4" fill="#D96A58"/><text x="652" y="168" font-family="Arial, sans-serif" font-size="18" fill="#30495F">Failed (HTTP 503)</text><text x="57" y="273" font-family="Arial,sans-serif" fill="#193049" font-size="21" font-weight="600">Unbounded</text><rect x="310" y="246" rx="7" width="670" height="55" fill="#E7EDF1"/><rect x="310" y="246" width="134" height="55" fill="#1B9A73"/><rect x="444" y="246" width="536" height="55" fill="#D96A58"/><text x="377" y="281" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white" text-anchor="middle">10 passed</text><text x="712" y="281" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white" text-anchor="middle">40 failed</text><text x="310" y="333" font-family="Arial,sans-serif" font-size="17" fill="#52687B">Average latency (all responses): 0.20s | Total test time: 1.00s</text><text x="57" y="417" font-family="Arial,sans-serif" fill="#193049" font-size="21" font-weight="600">Semaphore (10)</text><rect x="310" y="390" rx="7" width="670" height="55" fill="#E7EDF1"/><rect x="310" y="390" width="670" height="55" fill="#1B9A73"/><text x="645" y="425" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="white" text-anchor="middle">50 passed</text><text x="310" y="477" font-family="Arial,sans-serif" font-size="17" fill="#52687B">Average latency (all responses): 3.01s | Total test time: 5.02s</text><text x="58" y="566" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#193049">Faster responses can be misleading when most requests fail.</text><text x="58" y="598" font-family="Arial,sans-serif" font-size="15" fill="#67778A">Source: results/experiment_04 | Unbounded intentionally returns 503 above capacity.</text></svg>